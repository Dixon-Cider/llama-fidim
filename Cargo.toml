[workspace]
resolver = "2"
members = ["crates/llamactl-core", "crates/llamactl-cli", "ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex = "1"
anyhow = "1"
