name: release

# Tag a commit `vX.Y.Z` and this builds the CLI and the desktop app on a
# clean Windows runner, zips them with the license and README, and attaches
# the zip to a GitHub release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Tests
        run: cargo test --workspace

      - name: Build the CLI
        run: cargo build --release -p fidim-cli

      - name: Build the desktop app
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --no-bundle

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') { $tag = "dev-" + "${{ github.sha }}".Substring(0, 7) }
          $name = "llama-fidim-$tag-win-x64"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target\release\fidim.exe, target\release\llama-fidim.exe, LICENSE, README.md $name\
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          # LF and no BOM, so `sha256sum -c` matches the file name on any OS.
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\$name.zip.sha256", "$hash  $name.zip`n", (New-Object System.Text.UTF8Encoding($false)))
          "ASSET=$name.zip" | Add-Content $env:GITHUB_ENV

      - name: Smoke test the built CLI
        shell: pwsh
        run: |
          & target\release\fidim.exe --version
          & target\release\fidim.exe runtimes

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          generate_release_notes: true
