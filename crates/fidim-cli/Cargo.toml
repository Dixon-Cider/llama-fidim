[package]
name = "fidim-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# Two binaries since fidim-dg: `cargo run -p fidim-cli -- …` still means fidim.
default-run = "fidim"

[[bin]]
name = "fidim"
path = "src/main.rs"

[[bin]]
name = "fidim-dg"
path = "src/bin/fidim-dg.rs"

[dependencies]
fidim-core = { path = "../fidim-core" }
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
serde_json.workspace = true

[build-dependencies]
# Version resources for both executables (build.rs). Already in the lock
# file through tauri-build, so it adds no crate.
embed-resource = "3"
